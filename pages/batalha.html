<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoHora</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=menu"/>
    <link rel="stylesheet" href="/estilos/style.css">
    <link rel="stylesheet" href="/estilos/media.css">
    <link rel="icon" href="/assets/Ca105ad9cfc8580c765101d17bbb2323.webp">

    <style>
        body{
            margin: 0;
            background: #1f1f1f;
            color: white;
            font-family: Arial, sans-serif;
        }

        header{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: #292929;
        }

        .brand{
            display: flex;
            align-items: center;
            /* gap: 10px; */
        }

        .brand p{
            font-size: 24px;
            font-weight: bold;
            margin: 0;
        }

        /* imagem quadrada */
        .brand img{
            width: 30px;
            object-fit: cover;
        }

        .back-menu-button{
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
        }

        .title{
            text-align: center;
            margin-top: 30px;
        }

        .classes-container{
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 30px;
        }

        .class-card{
            width: 250px;
            background: #333;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }

        .class-card h2{
            margin-top: 0;
        }

        .class-card button{
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            cursor: pointer;
        }

        #classe-escolhida{
            text-align: center;
            font-size: 20px;
            padding-bottom: 40px;
        }

        .classe-img{
            width: 100%;
            height: 180px;

            object-fit: cover;

            border-radius: 10px;

            margin-top: 10px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <header>
        <div class="brand">
            <p>EcoHora</p>
            <img src="/assets/Ca105ad9cfc8580c765101d17bbb2323.webp" alt="logo">
        </div>

        <button onclick="backMenu()" class="back-menu-button">
            Menu
        </button>
    </header>

    <h1 class="title">Escolha sua Classe</h1>

    <div class="classes-container" id="classes-container">
        <!-- Cards serão criados aqui -->
    </div>

    <div id="classe-escolhida">
        Nenhuma classe escolhida
    </div>

    <script>

        // ======================
        // VOLTAR AO MENU
        // ======================
        function backMenu(){
            window.location.href = "/";
        }

        // ======================
        // SISTEMA DE CLASSES
        // ======================
        class ClassePersonagem {
            constructor(nome, vida, defesa, velocidade, especial, imagem) {
                this.nome = nome;
                this.vida = vida;
                this.defesa = defesa;
                this.velocidade = velocidade;
                this.especial = especial;
                this.imagem = imagem;
            }
        }

        // ======================
        // CLASSES DO JOGO
        // ======================
        const classes = [
            // DEFENSORES
            new ClassePersonagem(
                "Guerreiro",
                8,
                6,
                5,
                "Berserk",
                "/assets/guerreiro.jpg"
            ),

            new ClassePersonagem(
                "Escudeiro",
                10,
                8,
                2,
                "Muralha",
                "/assets/escudeiro.png"
            ),

            new ClassePersonagem(
                "Necromante",
                7,
                5,
                8,
                "Dos Mortos",
                "/assets/necromante.png"
            ),

            // SUPORTES
            new ClassePersonagem(
                "Clérigo",
                7,
                5,
                8,
                "Purificação",
                "/assets/clerigo.png"
            ),

            new ClassePersonagem(
                "Druída",
                6,
                3,
                10,
                "Canção da Natureza",
                "/assets/druida.jpg"
            ),

            new ClassePersonagem(
                "Bardo",
                5,
                3,
                12,
                "Animar a Festa",
                "/assets/bardo.png"
            ),

            // ATACANTES
            new ClassePersonagem(
                "Arqueiro",
                5,
                4,
                14,
                "Sniper",
                "/assets/arqueiro.png"
            ),

            new ClassePersonagem(
                "Ladino",
                4,
                2,
                20,
                "Apunhalada",
                "/assets/ladino.jpg"
            ),

            new ClassePersonagem(
                "Mago",
                5,
                3,
                10,
                "Magia Proíbida",
                "/assets/mago.png"
            )
        ];

        // ======================
        // CLASSE ESCOLHIDA
        // ======================
        let classeSelecionada = null;

        // ======================
        // CRIAR CARDS
        // ======================
        const container = document.getElementById("classes-container");

        classes.forEach(classe => {

            const card = document.createElement("div");

            card.classList.add("class-card");

            card.innerHTML = `
                <h2>${classe.nome}</h2>

                <p>❤️ Vida: ${classe.vida}</p>

                <p>🛡 Defesa: ${classe.defesa}</p>

                <p>⚡ Velocidade: ${classe.velocidade}</p>

                <p>✨ Especial: ${classe.especial}</p>

                <img
                    src="${classe.imagem}"
                    alt="${classe.nome}"
                    class="classe-img"
                >

                <button onclick="selecionarClasse('${classe.nome}')">
                    Escolher
                </button>
            `;

            container.appendChild(card);
        });

        // ======================
        // ESCOLHER CLASSE
        // ======================
        function selecionarClasse(nomeClasse){

            classeSelecionada = classes.find(
                classe => classe.nome === nomeClasse
            );

            document.getElementById(
                "classe-escolhida"
            ).innerHTML = `
                Classe escolhida:
                <strong>${classeSelecionada.nome}</strong>
            `;

            console.log(classeSelecionada);
        }

    </script>

</body>
</html>
